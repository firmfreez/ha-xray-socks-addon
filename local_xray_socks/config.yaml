name: "Local Xray SOCKS"
version: "0.6.0"
slug: "local_xray_socks"
description: "VPN manager: VLESS, AmneziaWG, OpenVPN and Check Point for Keenetic"
url: "https://github.com/firmfreez/ha-xray-socks-addon"
startup: services
boot: auto
init: false
watchdog: "tcp://[HOST]:8099"
ingress: true
ingress_port: 8099
panel_icon: mdi:vpn
panel_title: VPN Manager
arch:
  - aarch64

ports:
  1080/tcp: 1080
  1080/udp: 1080
  1081/tcp: 1081
  1082/tcp: 1082
  1083/tcp: 1083
  1084/tcp: 1084
  1085/tcp: 1085
  1086/tcp: 1086
  1087/tcp: 1087
  1088/tcp: 1088
  10530/tcp: 10530
  10530/udp: 10530
  10531/tcp: 10531
  10531/udp: 10531
  10532/tcp: 10532
  10532/udp: 10532
  10533/tcp: 10533
  10533/udp: 10533
  10534/tcp: 10534
  10534/udp: 10534
  10535/tcp: 10535
  10535/udp: 10535
  10536/tcp: 10536
  10536/udp: 10536
  10537/tcp: 10537
  10537/udp: 10537
  10538/tcp: 10538
  10538/udp: 10538

ports_description:
  1080/tcp: "Primary SOCKS5 (existing port)"
  1080/udp: "Primary VLESS/AmneziaWG UDP relay"
  1081/tcp: "Profile 1: SOCKS5 TCP"
  1082/tcp: "Profile 2: SOCKS5 TCP"
  1083/tcp: "Profile 3: SOCKS5 TCP"
  1084/tcp: "Profile 4: SOCKS5 TCP"
  1085/tcp: "Profile 5: SOCKS5 TCP"
  1086/tcp: "Profile 6: SOCKS5 TCP"
  1087/tcp: "Profile 7: SOCKS5 TCP"
  1088/tcp: "Profile 8: SOCKS5 TCP"
  10530/tcp: "Profile 0: corporate DNS (tcp)"
  10530/udp: "Profile 0: corporate DNS (udp)"
  10531/tcp: "Profile 1: corporate DNS (tcp)"
  10531/udp: "Profile 1: corporate DNS (udp)"
  10532/tcp: "Profile 2: corporate DNS (tcp)"
  10532/udp: "Profile 2: corporate DNS (udp)"
  10533/tcp: "Profile 3: corporate DNS (tcp)"
  10533/udp: "Profile 3: corporate DNS (udp)"
  10534/tcp: "Profile 4: corporate DNS (tcp)"
  10534/udp: "Profile 4: corporate DNS (udp)"
  10535/tcp: "Profile 5: corporate DNS (tcp)"
  10535/udp: "Profile 5: corporate DNS (udp)"
  10536/tcp: "Profile 6: corporate DNS (tcp)"
  10536/udp: "Profile 6: corporate DNS (udp)"
  10537/tcp: "Profile 7: corporate DNS (tcp)"
  10537/udp: "Profile 7: corporate DNS (udp)"
  10538/tcp: "Profile 8: corporate DNS (tcp)"
  10538/udp: "Profile 8: corporate DNS (udp)"

options:
  protocol: "vless"
  link: ""
  amneziawg_profile: "1"
  amneziawg_config: ""
  amneziawg_config_2: ""
  amneziawg_config_3: ""
  amneziawg_config_4: ""
  loglevel: "warning"
  watchdog_enabled: true
  watchdog_urls: "https://www.cloudflare.com/cdn-cgi/trace,https://www.google.com/generate_204"

schema:
  protocol: "list(vless|amneziawg)"
  link: str
  amneziawg_profile: "list(1|2|3|4)"
  amneziawg_config: str
  amneziawg_config_2: str
  amneziawg_config_3: str
  amneziawg_config_4: str
  loglevel: "list(none|error|warning|info|debug)"
  watchdog_enabled: "bool?"
  watchdog_urls: "str?"

privileged:
  - NET_ADMIN
  - SYS_ADMIN

apparmor: false

devices:
  - /dev/net/tun
